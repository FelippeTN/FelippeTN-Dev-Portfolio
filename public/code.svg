<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gradiente sutil para efeito 3D -->
    <linearGradient id="keyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"></stop>
      <stop offset="100%" stop-color="#EDEDED"></stop>
    </linearGradient>

    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"></feDropShadow>
    </filter>
  </defs>

  <!-- Base da tecla (profundidade inferior) -->
  <rect x="80" y="100" width="240" height="230" rx="40" fill="#DADADA"></rect>

  <!-- Parte superior da tecla -->
  <rect x="80" y="70" width="240" height="240" rx="40" fill="url(#keyGradient)" stroke="#000000" stroke-width="6" filter="url(#shadow)"></rect>

  <!-- Letra F inclinada -->
  <g transform="rotate(-8 200 190)">
    <path d="
      M170 120
      H255
      V150
      H205
      V185
      H245
      V215
      H205
      V275
      H170
      Z
    " fill="#000000"></path>
  </g>

</svg>